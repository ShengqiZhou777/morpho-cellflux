[project]
name = "morpho-cellflux"
version = "0.1.0"
description = "Perturbation -> morphology generative modeling on Perturb-Multi CRISPR hepatocyte images: a data factory, an absorbed CellFlux flow-matching engine, and direction/population evaluation."
requires-python = ">=3.10"
dependencies = [
  "anndata",
  "numpy",
  "pandas",
  "pyarrow",
  "pyyaml",
  "torch",
  "torchvision",
  "flow-matching",
  "torchdiffeq",
  "torchmetrics",
  "pytorch-lightning",
  "scikit-learn",
  "scipy",
  "matplotlib",
  "pillow",
  "tqdm",
]

[project.optional-dependencies]
cluster = ["submitit"]

[tool.setuptools.packages.find]
where = ["src"]

