[project]
name = "morpho-cellflux"
version = "0.1.0"
description = "Flow-matching conditional phenotype transport for FusionODE microalgae microscopy."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "anndata",
  "numpy",
  "pandas",
  "pyarrow",
  "pyyaml",
  "torch",
  "torchvision",
  "flow-matching",
  "torchdiffeq",
  "torchmetrics",
  "pytorch-lightning",
  "scikit-learn",
  "scipy",
  "matplotlib",
  "pillow",
  "tqdm",
  "wandb",
]

[project.optional-dependencies]
cluster = ["submitit"]

[tool.setuptools.packages.find]
where = ["."]
include = ["phenoflux*"]
