# PhenoFlux CRISPR — Marker-Aware Flow Matching for CRISPR Hepatocytes.
#
# PhenoFlux extends standard flow matching by conditioning on the full 18-channel
# MERFISH molecular profile through a Marker-Aware Conditioning (MAC) module:
#   MarkerProfileEncoder:  18 channels → spatially-structured feature tokens
#   Cross-Attention Bottleneck: UNet features query molecular state tokens
#   CCM: per-channel FiLM from pooled marker tokens
#
# Uses perturbmulti_id backbone (condition_dim=204 gene identity one-hot)
# with the crispr_paper_core image panel: [9,5,10] = Calreticulin/Perilipin/pS6RP.
#
# Usage:
#   torchrun --standalone --nproc_per_node=2 -m morphoflux.engine.train \
#     --dataset phenoflux_crispr --config phenoflux_crispr --device cuda \
#     --batch_size 20 --epochs 50 --use_initial 1 --cfg_scale 0.2 \
#     --use_ema --skewed_timesteps --class_drop_prob 0.2 \
#     --eval_frequency 5 --fid_samples 1000 --compute_fid --save_fid_samples \
#     --output_dir outputs/runs/crispr/phenoflux_crispr_v1

task_name: crispr_paper_core

ood_set: Null
mol_list: Null
trainable_emb: False
dataset_name: 'perturbmulti'
dataset: phenoflux_crispr        # PhenoFlux architecture (UNet + MAC + CCM)
n_channels: 3
channels: [9, 5, 10]             # 3-channel panel: Calreticulin / Perilipin / pS6RP
multimodal: False
batch_correction: False
batch_key: Null
use_condition_embeddings: False
add_controls: False
condition_embedding_dimension: null
modality_list:
  - Gene

image_path: data/raw/crispr/images
data_index_path: data/processed/crispr/index_paper_programs.csv
embedding_path: data/processed/crispr/embedding_gene_identity.csv

# Load full 18-channel MERFISH profile for PhenoFlux MAC module
use_marker_profile: true

augment_train: False
normalize: False
