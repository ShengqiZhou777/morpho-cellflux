# CRISPR perturbmulti — Program-Conditioned Gene Embedding (PCGE).
# Replaces flat 40-dim one-hot with hierarchical K=7 program embedding.
# 40 genes organized into 7 biological programs. Genes in the same
# program share representations for better generalization.
task_name: crispr_paper_core
ood_set: null
mol_list: null
trainable_emb: false
dataset_name: perturbmulti
dataset: phenoflux
n_channels: 3
channels: [9, 5, 10]
multimodal: false
batch_correction: false
batch_key: null
use_condition_embeddings: false
add_controls: false
condition_embedding_dimension: null
modality_list:
  - Gene
image_path: data/raw/crispr/images
data_index_path: data/processed/crispr/index_paper_40.csv
embedding_path: data/processed/crispr/embedding_paper_40.csv
use_marker_profile: true
augment_train: false
normalize: false
# PhenoFlux molecular prior
base_condition_dim: 40
use_pcge: true
pcge_embed_dim: 256
