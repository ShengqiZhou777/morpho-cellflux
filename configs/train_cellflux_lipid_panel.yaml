data:
  train_pairs: data/processed/pairs/train_pairs.parquet
  val_pairs: data/processed/pairs/val_pairs.parquet
  condition_vocab: data/processed/condition_vocab.json
  image_key: x
  channel_indices: [5, 0, 1]
  channel_names: [Perilipin, Alb, polyT]
  image_shape: [3, 128, 128]

model:
  hidden_channels: 96
  channel_mults: [1, 2, 4, 8]
  embedding_dim: 256
  high_frequency_residual: true

flow_matching:
  target_scaffold: true
  mask_threshold: 0.0001
  start_mode: source_mean
  start_noise_scale: 0.2
  start_noise_prob: 0.0
  condition_drop_prob: 0.2
  null_condition_id: 0
  source_noise_prob: 0.2
  source_noise_scale: 0.01

loss:
  foreground_weight: 1.0
  image_weight: 0.35
  highpass_weight: 1.5
  highpass_channels: [0, 1, 2]
  highpass_kernel: 9
  highpass_sigma: 1.5
  puncta_weight: 1.0
  puncta_channels: [0]
  puncta_fraction: 0.03
  puncta_kernel: 9
  puncta_sigma: 1.5
  puncta_temperature: 0.05
  residual_weight: 1.0
  residual_channels: [0, 1, 2]
  residual_kernel: 9
  residual_sigma: 1.5
  residual_scale: 1.0

training:
  seed: 17
  device: auto
  batch_size: 160
  max_steps: 2000
  learning_rate: 0.0001
  weight_decay: 0.000001
  grad_clip_norm: 1.0
  num_workers: 12
  persistent_workers: true
  prefetch_factor: 4
  pin_memory: true
  log_every: 50
  val_every: epoch
  save_every: 1000
  val_batches: 64
  preview_every: 1000
  output_dir: outputs/cellflux_lipid_panel_scaffold_ddp_bs160_2k

sampling:
  steps: 16
  guidance_scale: 1.2
  start_mode: source_mean
  start_noise_scale: 0.2
