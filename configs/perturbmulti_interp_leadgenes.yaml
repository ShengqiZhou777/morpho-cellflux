# Perturb-Multi hepatocytes -- INTERPOLATION FIGURE subset (lead genes only).
# Same setup as perturbmulti_stronghits_id (gene-identity one-hot, panel2 [5,9,10]),
# but the treated cells are restricted to 5 lead genes spanning all 3 channels so the
# single interpolation eval batch always lands on genes with real signal:
#   Pten, Eif2s1 -> Perilipin (steatosis);  Atp2a2 -> Calreticulin (UPR);
#   Cdc37, Tsc1  -> pS6RP (mTOR).  Pten moves both Perilipin and pS6RP.
# Used only by scripts/interpolate.sh (eval_only --interpolate). The full
# control pool is kept for same-BATCH source pairing.
task_name: perturbmulti_interp_leadgenes

ood_set: Null
mol_list: Null
trainable_emb: False
dataset_name: 'perturbmulti'
n_channels: 3
multimodal: False
batch_correction: False
batch_key: Null
use_condition_embeddings: False
add_controls: False
condition_embedding_dimension: null
modality_list:
  - Gene

image_path: data/raw/extracted_images
data_index_path: data/processed/perturbmulti/index_interp_leadgenes.csv
embedding_path: data/processed/perturbmulti/embedding_gene_identity.csv

augment_train: False
normalize: False
