data:
  train_pairs: data/processed/pairs/train_pairs.parquet
  val_pairs: data/processed/pairs/val_pairs.parquet
  condition_vocab: data/processed/condition_vocab.json
  image_key: x
  image_shape: [18, 128, 128]

model:
  hidden_channels: 32
  channel_mults: [1, 2, 4]
  embedding_dim: 128

flow_matching:
  condition_drop_prob: 0.2
  null_condition_id: 0
  source_noise_prob: 0.5
  source_noise_scale: 0.01

training:
  seed: 17
  device: auto
  batch_size: 8
  max_steps: 10000
  learning_rate: 0.0001
  weight_decay: 0.000001
  grad_clip_norm: 1.0
  num_workers: 4
  pin_memory: true
  log_every: 50
  save_every: 500
  val_batches: 16
  preview_every: 500
  output_dir: outputs/cellflux_run

sampling:
  steps: 16
  guidance_scale: 1.2
