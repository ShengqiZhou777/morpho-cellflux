# Perturb-Multi hepatocytes -- paper-core interpolation figure subset.
# Same marker panel and gene-identity conditioning as crispr_paper_core, with
# a small representative gene list from the original Perturb-Multi programs.
# Used only by scripts/interpolate.sh (eval_only --interpolate).
task_name: crispr_paper_core_interp

ood_set: Null
mol_list:
  - Insig1
  - Pten
  - Eif2s1
  - Sel1l
  - Xbp1
  - Mtor
  - Tsc1
trainable_emb: False
dataset_name: 'perturbmulti'
n_channels: 3
channels: [9, 5, 10]   # Calreticulin(9), Perilipin(5), pS6RP(10)
multimodal: False
batch_correction: False
batch_key: Null
use_condition_embeddings: False
add_controls: False
condition_embedding_dimension: null
modality_list:
  - Gene

image_path: data/raw/crispr/images
data_index_path: data/processed/crispr/index_paper_programs.csv
embedding_path: data/processed/crispr/embedding_gene_identity.csv

augment_train: False
normalize: False
