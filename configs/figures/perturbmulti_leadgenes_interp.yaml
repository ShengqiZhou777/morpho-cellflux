# Perturb-Multi hepatocytes -- interpolation figure subset (lead genes only).
# Same setup as perturbmulti_train_id (gene-identity one-hot), but the treated
# cells are restricted to lead genes spanning the active CRISPR panel.
# Used only by scripts/interpolate.sh (eval_only --interpolate). The full
# control pool is kept for same-BATCH source pairing.
task_name: perturbmulti_leadgenes_interp

ood_set: Null
mol_list: Null
trainable_emb: False
dataset_name: 'perturbmulti'
n_channels: 3
channels: [0, 14, 5]   # Alb(0), Rab7(14), Perilipin(5)
multimodal: False
batch_correction: False
batch_key: Null
use_condition_embeddings: False
add_controls: False
condition_embedding_dimension: null
modality_list:
  - Gene

image_path: data/raw/extracted_images
data_index_path: data/processed/perturbmulti/index_eval_leadgenes.csv
embedding_path: data/processed/perturbmulti/embedding_gene_identity.csv

augment_train: False
normalize: False
