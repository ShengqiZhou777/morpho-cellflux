# Perturb-Multi hepatocytes -- CRISPR RNA-signature conditioning ablation.
# Condition = concat[ gene-identity one-hot (204) ; scale-balanced 209-dim MERFISH RNA
# signature (209) ] = 413  (embedding_gene_idsig.csv). The signature S(g) is the per-gene
# mean 209-gene RNA, z-scored vs control (non-leaky: gene-level average, not the cell's own
# RNA). Genes without a signature fall back to pure identity (zero signature block).
# Same image panel + rna_snr-filtered 76-gene index as the one-hot main config, so the ONLY change is the
# condition -> isolates the effect of richer conditioning. Uses arch perturbmulti_idsig
# (condition_dim 413); run with DATASET=perturbmulti_idsig.
task_name: perturbmulti_idsig

ood_set: Null
mol_list: Null
trainable_emb: False
dataset_name: 'perturbmulti'
n_channels: 3
channels: [0, 14, 5]   # npz indices: Alb(0), Rab7(14), Perilipin(5)
multimodal: False
batch_correction: False
batch_key: Null
use_condition_embeddings: False
add_controls: False
condition_embedding_dimension: null
modality_list:
  - Gene

image_path: data/raw/extracted_images
data_index_path: data/processed/perturbmulti/index_train.csv
embedding_path: data/processed/perturbmulti/embedding_gene_idsig.csv

augment_train: False
normalize: False
