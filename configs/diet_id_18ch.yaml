# 18-channel naive baseline for diet hepatocytes.
# Same as diet_id, but condition_dim = 21 (3×one-hot + 18×marker profile concatenated).
# The marker profile is concatenated into the condition vector in the train/eval loop —
# no MAC, no cross-attention, no CCM.  This tests whether MAC's structural inductive
# bias matters beyond simply having access to the 18-channel data.
#
# Usage:
#   CONFIG=diet_id_18ch DATASET=diet_id_18ch bash scripts/train.sh
#
#

task_name: diet_id

ood_set: Null
mol_list: Null
trainable_emb: False
dataset_name: 'perturbmulti'
dataset: diet_id_18ch           # 18-ch naive baseline (no MAC)
n_channels: 3
channels: [9, 5, 8]             # 3-channel RGB panel: Calreticulin / Perilipin / TOMM20
multimodal: False
batch_correction: False
batch_key: Null
use_condition_embeddings: False
add_controls: False
condition_embedding_dimension: null
modality_list:
  - Gene

image_path: data/raw/diet/images
data_index_path: data/processed/diet/index_diet.csv
embedding_path: data/processed/diet/embedding_diet.csv

# Load full 18-channel profile (concat'd into condition vector by train/eval loop)
use_marker_profile: true

augment_train: True
normalize: False
