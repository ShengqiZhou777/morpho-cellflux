project:
  name: morpho-cellflux
  description: Data factory for Perturb-Multi CRISPR hepatocytes.

paths:
  # Raw Perturb-Multi assets are self-contained under data/raw/. The per-dataset
  # layout (crispr/, diet/, metadata/) is defined by RAW_ASSETS in
  # src/morphoflux/data/factory.py.
  raw_dir: data/raw
  processed_dir: data/processed
  reports_dir: data/reports

data:
  image_key: x
  image_shape: [18, 128, 128]
  cell_type_filter: Hep
  control_column: is_control
  condition_column: target_gene
  guide_column: sgRNA
  split_column: split
  match_columns: [batch, cluster_type]
  control_split_policy: same_split
  min_controls_per_stratum: 10
  pairs_per_target: 1
  random_seed: 17

outputs:
  manifest: data/processed/manifest.parquet
  pairs_dir: data/processed/pairs
  condition_vocab: data/processed/condition_vocab.json
  audit_report: data/reports/data_audit.json
