# Perturb-Multi hepatocytes -- MAIN TRAINING index.
# Perturbation condition = pure gene IDENTITY (one-hot -> learnable embedding),
# NOT a transcriptional readout. Trains on the rna_snr-filtered gene set (TIER1/2 with
# confirmed knockdown, ~76 target genes) + control.
# Image panel = channels [0,14,5] = Alb / Rab7 / Perilipin: the broadest/strongest per-gene
# image responders to the CRISPR set (18-channel effect scan).
task_name: perturbmulti_train_id

ood_set: Null
mol_list: Null
trainable_emb: False
dataset_name: 'perturbmulti'
n_channels: 3
channels: [0, 14, 5]   # npz indices: Alb(0), Rab7(14), Perilipin(5)
multimodal: False
batch_correction: False
batch_key: Null
use_condition_embeddings: False
add_controls: False
condition_embedding_dimension: null
modality_list:
  - Gene

image_path: data/raw/extracted_images
data_index_path: data/processed/perturbmulti/index_train.csv
embedding_path: data/processed/perturbmulti/embedding_gene_identity.csv

augment_train: False
normalize: False
