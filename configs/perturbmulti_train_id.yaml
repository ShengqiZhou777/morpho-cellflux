# Perturb-Multi hepatocytes -- MAIN TRAINING index, HONEST BASELINE.
# Perturbation condition = pure gene IDENTITY (one-hot -> learnable embedding),
# NOT a transcriptional readout. Trains on ALL kept genes (TIER1/2 + control,
# ~163 target genes) to maximize data and learn the full gene-identity space.
# Image = panel2 [5,9,10] = Perilipin / Calreticulin / pS6RP.
task_name: perturbmulti_train_id

ood_set: Null
mol_list: Null
trainable_emb: False
dataset_name: 'perturbmulti'
n_channels: 3
multimodal: False
batch_correction: False
batch_key: Null
use_condition_embeddings: False
add_controls: False
condition_embedding_dimension: null
modality_list:
  - Gene

image_path: data/raw/extracted_images
data_index_path: data/processed/perturbmulti/index_train.csv
embedding_path: data/processed/perturbmulti/embedding_gene_identity.csv

augment_train: False
normalize: False
