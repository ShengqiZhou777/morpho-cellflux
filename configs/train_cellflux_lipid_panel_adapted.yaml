data:
  train_pairs: data/processed/pairs/train_pairs.parquet
  val_pairs: data/processed/pairs/val_pairs.parquet
  condition_vocab: data/processed/condition_vocab.json
  image_key: x
  channel_indices: [5, 0, 1]
  channel_names: [Perilipin, Alb, polyT]
  image_shape: [3, 128, 128]

model:
  hidden_channels: 128
  channel_mults: [1, 2, 4, 8]
  embedding_dim: 256
  high_frequency_residual: false

flow_matching:
  target_scaffold: false
  mask_threshold: 0.0001
  start_mode: source
  condition_drop_prob: 0.2
  null_condition_id: 0
  source_noise_prob: 0.5
  source_noise_scale: 0.10

loss: {}

training:
  seed: 17
  device: auto
  batch_size: 156
  max_steps: 6000
  learning_rate: 0.0001
  weight_decay: 0.000001
  grad_clip_norm: 1.0
  num_workers: 12
  persistent_workers: true
  prefetch_factor: 4
  pin_memory: true
  log_every: 50
  val_every: epoch
  save_every: 3000
  val_batches: 64
  preview_every: 3000
  output_dir: outputs/cellflux_lipid_panel_adapted_ddp_bs156_noise010_6k

sampling:
  steps: 16
  guidance_scale: 1.2
  start_mode: source
